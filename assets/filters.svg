<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
  <!-- Figma GRAIN 효과: 가장자리를 부드러운 물결로 일렁이게 만드는 필터 -->
  <filter id="grain" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
